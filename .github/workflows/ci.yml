name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela ejecuciones anteriores del mismo branch/PR cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos: el token solo necesita leer el repositorio.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, build y typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Cache de build de Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Lint
        run: npm run lint

      # `next build` genera next-env.d.ts y .next/types/*.d.ts (tipos de
      # imports de imagen y de rutas tipadas). En un checkout limpio esos
      # archivos no existen todavía, así que el build va antes que el
      # typecheck independiente para que "tsc --noEmit" los encuentre.
      - name: Build de producción
        run: npm run build

      - name: Verificación de tipos
        run: npm run typecheck
